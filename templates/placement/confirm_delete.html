{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <i class="bi bi-exclamation-triangle display-4 text-danger"></i>
  <h4 class="mt-3">Are you sure you want to delete "{{ object }}"?</h4>
  <form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger rounded-pill-btn px-4">Yes, Delete</button>
    <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill-btn px-4">Cancel</a>
  </form>
</div>
{% endblock %}
