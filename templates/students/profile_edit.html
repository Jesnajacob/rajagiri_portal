{% extends "base.html" %}
{% block title %}Edit Profile - RCSS Connect{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="rcss-card p-4">
        <h4 class="mb-1">Edit Profile</h4>
        <p class="text-muted mb-4">Register No: {{ profile.register_number }}</p>
        <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
          {% csrf_token %}
          {% include "partials/form_fields.html" %}
          <button type="submit" class="btn btn-primary rounded-pill-btn px-4">Save Changes</button>
          <a href="{% url 'students:portfolio' %}" class="btn btn-outline-secondary rounded-pill-btn px-4">View Portfolio</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
