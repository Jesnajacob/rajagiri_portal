{% extends "base.html" %}
{% block title %}Add Achievement - RCSS Connect{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="rcss-card p-4">
        <h4 class="mb-3"><i class="bi bi-trophy text-warning"></i> Add Achievement</h4>
        <form method="post" class="needs-validation" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select name="achievement_type" class="form-select">
              {% for value, label in types %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary rounded-pill-btn px-4">Save Achievement</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
