{% extends "base.html" %}
{% block title %}Add Certification - RCSS Connect{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="rcss-card p-4">
        <h4 class="mb-3"><i class="bi bi-patch-check text-primary"></i> Add Certification</h4>
        <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
          {% csrf_token %}
          {% include "partials/form_fields.html" %}
          <button type="submit" class="btn btn-primary rounded-pill-btn px-4">Save Certification</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
